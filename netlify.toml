# Netlify Configuration for Nitin Systems (Pure Static HTML5 / CSS3 / WebP)
[build]
  command = ""
  publish = "."

# Explicitly disable auto-detected Next.js plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"
  enabled = false

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Clean URL Redirects (e.g. /systems -> /systems.html)
[[redirects]]
  from = "/systems"
  to = "/systems.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/approach"
  to = "/approach.html"
  status = 200

[[redirects]]
  from = "/insights"
  to = "/insights.html"
  status = 200

[[redirects]]
  from = "/audit"
  to = "/audit.html"
  status = 200

# Security & High-Performance Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
