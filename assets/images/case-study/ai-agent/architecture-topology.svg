  <!-- LOOPBACK: In-Chat Intake Card Direct Dispatch (Cobalt to Emerald) -->
  <path d="M 107 140 L 107 338 L 825 338 L 825 317" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="3 3"/>
