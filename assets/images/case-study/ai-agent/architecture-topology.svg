  <text x="40" y="72" fill="#3B82F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700" letter-spacing="0.05em">01 · CLIENT RUNTIME</text>
